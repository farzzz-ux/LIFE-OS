<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Minimalist Squircle Base matching .brand-icon -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#brandGrad)"/>
  
  <!-- Minimalist Atom Orbitals & Core -->
  <g transform="translate(32, 32)">
    <!-- Central Nucleus -->
    <circle cx="0" cy="0" r="4.2" fill="#ffffff"/>
    
    <!-- Orbital Ring 1: Horizontal -->
    <ellipse cx="0" cy="0" rx="21" ry="8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    
    <!-- Orbital Ring 2: Rotated 60 deg -->
    <ellipse cx="0" cy="0" rx="21" ry="8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" transform="rotate(60)"/>
    
    <!-- Orbital Ring 3: Rotated 120 deg -->
    <ellipse cx="0" cy="0" rx="21" ry="8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" transform="rotate(120)"/>
  </g>
</svg>
